name: Binaries

# Prebuilt, self-contained binaries (libgit2 and OpenSSL built in, see the
# `vendored` feature) for machines without Nix or a Rust toolchain. Built on
# every tag `v*` and attached to its GitHub release; run it by hand to get
# them as workflow artifacts instead.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      # The toolchain itself comes from rust-toolchain.toml.
      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --features vendored --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          name="pullomatic-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/pullomatic" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz*

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber pullomatic-*.tar.gz*
